    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Waarom kiezen voor studenten?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Onze consultants brengen de nieuwste academische kennis en een frisse, onafhankelijke blik mee. Omdat we geen belang hebben bij een bepaalde uitkomst, durven we de moeilijke vragen te stellen."
            }
          },
          {
            "@type": "Question",
            "name": "Hoe wordt de kwaliteit bewaakt?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Elk project wordt uitgevoerd door een team van consultants met verschillende achtergronden. Door samen te werken en tussentijds met u af te stemmen, zorgen we dat het eindresultaat aansluit bij uw vraag."
            }
          },
          {
            "@type": "Question",
            "name": "Wat kost een project?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Elk project is maatwerk. Na een vrijblijvend kennismakingsgesprek ontvangt u een voorstel met een heldere prijsopgave."
            }
          },
          {
            "@type": "Question",
            "name": "Hoe lang duurt een project?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Dat hangt af van de omvang van het vraagstuk. In het projectvoorstel staat een duidelijke planning, zodat u vooraf weet waar u aan toe bent."
            }
          },
          {
            "@type": "Question",
            "name": "Voor wat voor organisaties werken jullie?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Voor startups, gevestigde bedrijven, kennisinstellingen en overheidsorganisaties. Van ReMediZ en PalmSens tot de Unie van Waterschappen en de Universiteit Utrecht."
            }
          },
          {
            "@type": "Question",
            "name": "Is een kennismaking vrijblijvend?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ja. Neem contact op via info@shift-innovatie.nl, dan plannen we een gesprek."
            }
          }
        ]
      }
